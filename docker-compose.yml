services:
  postgres:
    image: postgres
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metrics}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppass123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./go-app/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - app_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-metrics}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  go-app:
    build:
      context: ./go-app
      dockerfile: Dockerfile
    container_name: go-app
    environment:
      HOST: postgres
      PORT: 5432
      DB_NAME: ${POSTGRES_DB:-metrics}
      USER: ${POSTGRES_USER:-appuser}
      PASSWORD: ${POSTGRES_PASSWORD:-apppass123}

    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--storage.tsdb.retention.time=15d"
    networks:
      - app_network
    restart: unless-stopped
    depends_on:
      - go-app

  grafana:
    image: grafana/grafana
    container_name: grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER:  admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP:    "false"
      # automatically add Prometheus as the default DS
      GF_DATASOURCES_PROVISIONING_ENABLED:  "true"
    volumes:
      - grafana_data:/var/lib/grafana

      # Provision the Prometheus data source
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro

      # Provision your dashboard JSON
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro

      # Dashboard provider config
      - ./grafana/provisioning/dashboard_providers:/etc/grafana/provisioning/dashboard_providers:ro

    networks:
      - app_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  app_network:
    driver: bridge
